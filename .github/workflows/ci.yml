name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      # Descarga los CSV de INEGI y genera data/eic.duckdb, que usan las pruebas.
      - run: uv run python -m eic.etl
      - run: uv run python tests/test_etl.py
      - run: uv run python tests/test_api.py
      - run: uv run python tests/test_mcp.py
