# docker compose up -d     → corre el ETL una vez, luego levanta API, MCP y nginx
# docker compose run --rm etl   → recarga los datos (la API toma la base nueva sin reiniciar)
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  etl:
    build: .
    command: ["python", "-m", "eic.etl"]
    volumes:
      - eic-data:/app/data
    mem_limit: 1g
    cpus: 1
    logging: *logging
    restart: "no"

  api:
    build: .
    depends_on:
      etl:
        condition: service_completed_successfully
    environment:
      EIC_ROOT_PATH: /api
      EIC_DB_MEMORY: ${EIC_DB_MEMORY:-256MB}
      EIC_DB_THREADS: ${EIC_DB_THREADS:-1}
    volumes:
      - eic-data:/app/data:ro
    mem_limit: 768m
    cpus: 2
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/datasets')"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build: .
    command: ["uvicorn", "eic.mcp_server:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
              "--limit-concurrency", "64", "--timeout-keep-alive", "5", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      etl:
        condition: service_completed_successfully
    environment:
      EIC_DB_MEMORY: ${EIC_DB_MEMORY:-256MB}
      EIC_DB_THREADS: ${EIC_DB_THREADS:-1}
    volumes:
      - eic-data:/app/data:ro
    mem_limit: 1g
    cpus: 2
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EIC_PORT:-8081}:80"   # solo local: el acceso público entra por Cloudflare Tunnel
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped

volumes:
  eic-data:
