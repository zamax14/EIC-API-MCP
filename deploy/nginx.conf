# Protección de la API pública: límite de peticiones y conexiones por IP y caché de respuestas.
# IP real del cliente detrás del proxy del host (Caddy, nginx, Cloudflare Tunnel…), que llega por el gateway de
# Docker y la manda en X-Forwarded-For. Es seguro confiar en estas redes porque compose solo publica en 127.0.0.1.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
proxy_cache_path /var/cache/nginx/eic keys_zone=eic:10m max_size=512m inactive=1h use_temp_path=off;

upstream api { server api:8000; keepalive 16; }
upstream mcp { server mcp:8000; keepalive 16; }

server {
    listen 80;
    server_tokens off;
    absolute_redirect off;  # redirecciones relativas: el host y el esquema públicos los pone Cloudflare
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 4 8k;

    limit_req  zone=por_ip burst=20 nodelay;
    limit_conn conn_ip 10;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json;

    location = /api  { return 302 /api/docs; }
    location = /api/ { return 302 /api/docs; }

    # La API se publica bajo /api; la barra final de proxy_pass quita el prefijo.
    location /api/ {
        limit_except GET { deny all; }  # GET implica HEAD

        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Los datos solo cambian cuando corre el ETL: cachear evita que peticiones repetidas lleguen a la API.
        proxy_cache eic;
        proxy_cache_valid 200 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # MCP (streamable HTTP, sin sesión): POST JSON-RPC, sin caché.
    location /mcp {
        limit_except GET POST DELETE { deny all; }
        client_max_body_size 64k;

        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
